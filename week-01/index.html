<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect 4</title>
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e3ded3;
    --board: #2f5bd3;
    --board-edge: #2449b0;
    --hole: #e9edf7;
    --red: #e5484d;
    --red-dark: #b8343a;
    --yellow: #f5b70a;
    --yellow-dark: #c48d00;
    --accent: #2f5bd3;
    --shadow: 0 10px 30px rgba(31, 36, 48, 0.12);

    --gap: clamp(5px, 1.6vw, 10px);
    --pad: clamp(8px, 2.2vw, 14px);
    --cell: clamp(34px, calc((100vw - 32px - 2 * var(--pad) - 6 * var(--gap)) / 7), 68px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c;
      --surface: #1d2029;
      --text: #eef0f5;
      --muted: #9aa1b0;
      --border: #2c303b;
      --board: #2a4fb8;
      --board-edge: #1f3d92;
      --hole: #12141a;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  main {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 6vw, 38px);
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--red); }

  /* Scoreboard */
  .scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .score {
    padding: 10px 8px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .score:last-child { border-right: none; }
  .score .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .score .value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.red { background: var(--red); }
  .dot.yellow { background: var(--yellow); }

  /* Status */
  .status {
    min-height: 28px;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status .dot { width: 14px; height: 14px; }
  .thinking::after {
    content: "";
    display: inline-block;
    width: 1.2em;
    text-align: left;
    animation: dots 1s steps(4) infinite;
  }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }

  /* Board */
  .game { display: flex; flex-direction: column; align-items: center; }
  .preview {
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    gap: var(--gap);
    padding: 0 var(--pad);
    height: calc(var(--cell) * 0.8);
    align-items: center;
  }
  .preview div {
    width: var(--cell);
    height: var(--cell);
    border-radius: 50%;
    transform: scale(0.8);
    opacity: 0;
    transition: opacity 0.12s;
  }
  .preview div.show { opacity: 0.55; background: var(--red); }

  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    grid-template-rows: repeat(6, var(--cell));
    gap: var(--gap);
    padding: var(--pad);
    background: var(--board);
    border-radius: 18px;
    box-shadow: inset 0 -6px 0 var(--board-edge), var(--shadow);
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
  }
  .board.locked { cursor: default; }
  .col-hl {
    position: absolute;
    top: 0;
    bottom: 0;
    width: calc(var(--cell) + var(--gap));
    background: rgba(255, 255, 255, 0.1);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s, transform 0.08s;
  }
  .col-hl.show { opacity: 1; }
  .cell {
    position: relative;
    width: var(--cell);
    height: var(--cell);
    border-radius: 50%;
    background: var(--hole);
    box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.25);
  }
  .disc {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 2;
  }
  .disc.red {
    background: radial-gradient(circle at 35% 30%, #ff7a7e, var(--red) 55%, var(--red-dark));
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
  }
  .disc.yellow {
    background: radial-gradient(circle at 35% 30%, #ffd863, var(--yellow) 55%, var(--yellow-dark));
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15);
  }
  .disc.drop {
    animation: drop var(--dur) cubic-bezier(0.5, 0, 0.75, 0) forwards,
               bounce 0.22s ease-out var(--dur);
  }
  @keyframes drop {
    from { transform: translateY(calc(-1 * var(--fall) * (var(--cell) + var(--gap)))); }
    to { transform: translateY(0); }
  }
  @keyframes bounce {
    0% { transform: translateY(0); }
    40% { transform: translateY(-12%); }
    100% { transform: translateY(0); }
  }
  .board.over .disc:not(.win) { opacity: 0.45; transition: opacity 0.4s; }
  .disc.win {
    animation: pulse 1s ease-in-out infinite;
    outline: 3px solid #fff;
    outline-offset: -3px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(0.86); }
  }

  /* Controls */
  .controls {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
  }
  .group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .group > span {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .seg {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
  }
  .seg button {
    border: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
  }
  .btn {
    border: none;
    background: var(--red);
    color: #fff;
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 11px 22px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--red-dark);
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--red-dark); }
  .link {
    background: none;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .disc.drop, .disc.win, .thinking::after { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Connect <span>4</span></h1>

  <section class="scores" aria-label="Score">
    <div class="score">
      <div class="label"><span class="dot red"></span>You</div>
      <div class="value" id="score-human">0</div>
    </div>
    <div class="score">
      <div class="label">Draws</div>
      <div class="value" id="score-draw">0</div>
    </div>
    <div class="score">
      <div class="label"><span class="dot yellow"></span>Computer</div>
      <div class="value" id="score-ai">0</div>
    </div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="game">
    <div class="preview" id="preview" aria-hidden="true"></div>
    <div class="board" id="board" role="grid" aria-label="Connect 4 board. Press 1 to 7 to drop a disc.">
      <div class="col-hl" id="col-hl"></div>
    </div>
  </div>

  <div class="controls">
    <div class="group">
      <span>Difficulty</span>
      <div class="seg" id="difficulty">
        <button data-level="easy">Easy</button>
        <button data-level="medium">Medium</button>
        <button data-level="hard">Hard</button>
      </div>
    </div>
    <div class="group">
      <span>First move</span>
      <div class="seg" id="first">
        <button data-first="human">You</button>
        <button data-first="ai">Computer</button>
      </div>
    </div>
  </div>

  <button class="btn" id="new-game">New game</button>
  <p class="hint">Click a column or press keys 1–7 to drop a disc. Settings apply to the next game.</p>
  <button class="link" id="reset-score">Reset score</button>
</main>

<script>
  const ROWS = 6;
  const COLS = 7;
  const EMPTY = 0, HUMAN = 1, AI = 2;
  const CENTER_FIRST = [3, 2, 4, 1, 5, 0, 6];
  const LEVELS = {
    easy:   { depth: 2, noise: 60 },
    medium: { depth: 4, noise: 6 },
    hard:   { depth: 7, noise: 0 },
  };

  // Every possible line of four cells on the board.
  const WINDOWS = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        const cells = [];
        for (let i = 0; i < 4; i++) cells.push([r + dr * i, c + dc * i]);
        if (cells.every(([rr, cc]) => rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS)) {
          WINDOWS.push(cells);
        }
      }
    }
  }

  // ---------- Game logic ----------

  function emptyBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
  }

  function openRow(b, col) {
    for (let r = ROWS - 1; r >= 0; r--) if (b[r][col] === EMPTY) return r;
    return -1;
  }

  function validMoves(b) {
    return CENTER_FIRST.filter(c => b[0][c] === EMPTY);
  }

  function winningLine(b, player) {
    for (const w of WINDOWS) {
      if (w.every(([r, c]) => b[r][c] === player)) return w;
    }
    return null;
  }

  function scoreWindow(b, w) {
    let ai = 0, human = 0;
    for (const [r, c] of w) {
      if (b[r][c] === AI) ai++;
      else if (b[r][c] === HUMAN) human++;
    }
    if (ai && human) return 0;
    if (ai === 3) return 50;
    if (ai === 2) return 8;
    if (human === 3) return -60;
    if (human === 2) return -8;
    return 0;
  }

  // Positive scores favour the computer.
  function evaluate(b) {
    let score = 0;
    for (let r = 0; r < ROWS; r++) {
      if (b[r][3] === AI) score += 6;
      else if (b[r][3] === HUMAN) score -= 6;
    }
    for (const w of WINDOWS) score += scoreWindow(b, w);
    return score;
  }

  function minimax(b, depth, alpha, beta, maximizing) {
    if (winningLine(b, AI)) return 1e6 + depth;
    if (winningLine(b, HUMAN)) return -1e6 - depth;
    const moves = validMoves(b);
    if (moves.length === 0) return 0;
    if (depth === 0) return evaluate(b);

    if (maximizing) {
      let best = -Infinity;
      for (const c of moves) {
        const r = openRow(b, c);
        b[r][c] = AI;
        best = Math.max(best, minimax(b, depth - 1, alpha, beta, false));
        b[r][c] = EMPTY;
        alpha = Math.max(alpha, best);
        if (alpha >= beta) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (const c of moves) {
        const r = openRow(b, c);
        b[r][c] = HUMAN;
        best = Math.min(best, minimax(b, depth - 1, alpha, beta, true));
        b[r][c] = EMPTY;
        beta = Math.min(beta, best);
        if (alpha >= beta) break;
      }
      return best;
    }
  }

  function chooseMove(b, level) {
    const { depth, noise } = LEVELS[level];
    let bestCol = null, bestScore = -Infinity;
    for (const c of validMoves(b)) {
      const r = openRow(b, c);
      b[r][c] = AI;
      // Noise makes easier levels miss subtle threats, but never a forced win or loss.
      const score = minimax(b, depth - 1, -Infinity, Infinity, false) + Math.random() * noise;
      b[r][c] = EMPTY;
      if (score > bestScore) {
        bestScore = score;
        bestCol = c;
      }
    }
    return bestCol;
  }

  // ---------- UI ----------

  const boardEl = document.getElementById('board');
  const previewEl = document.getElementById('preview');
  const colHl = document.getElementById('col-hl');
  const statusEl = document.getElementById('status');
  const scoreEls = {
    [HUMAN]: document.getElementById('score-human'),
    [AI]: document.getElementById('score-ai'),
    [EMPTY]: document.getElementById('score-draw'),
  };

  const cells = [];
  for (let r = 0; r < ROWS; r++) {
    cells.push([]);
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.col = c;
      boardEl.appendChild(cell);
      cells[r].push(cell);
    }
  }
  const previewDiscs = [];
  for (let c = 0; c < COLS; c++) {
    const d = document.createElement('div');
    previewEl.appendChild(d);
    previewDiscs.push(d);
  }

  let board, turn, over, busy, gameId = 0, hoverCol = null;
  let settings = { level: 'medium', first: 'human' };
  let scores = { [HUMAN]: 0, [AI]: 0, [EMPTY]: 0 };

  try {
    const saved = JSON.parse(localStorage.getItem('connect4') || 'null');
    if (saved) {
      if (saved.settings) settings = { ...settings, ...saved.settings };
      if (saved.scores) scores = { ...scores, ...saved.scores };
    }
  } catch (e) { /* storage unavailable: use defaults */ }

  function save() {
    try { localStorage.setItem('connect4', JSON.stringify({ settings, scores })); } catch (e) {}
  }

  const sleep = ms => new Promise(res => setTimeout(res, ms));

  function setStatus(text, color, thinking = false) {
    statusEl.innerHTML = '';
    if (color) {
      const dot = document.createElement('span');
      dot.className = 'dot ' + color;
      statusEl.appendChild(dot);
    }
    const t = document.createElement('span');
    t.textContent = text;
    if (thinking) t.className = 'thinking';
    statusEl.appendChild(t);
  }

  function renderScores() {
    for (const k of [HUMAN, AI, EMPTY]) scoreEls[k].textContent = scores[k];
  }

  function renderSettings() {
    for (const b of document.querySelectorAll('#difficulty button')) {
      b.setAttribute('aria-pressed', b.dataset.level === settings.level);
    }
    for (const b of document.querySelectorAll('#first button')) {
      b.setAttribute('aria-pressed', b.dataset.first === settings.first);
    }
  }

  function updateHover() {
    const canPlay = !over && !busy && turn === HUMAN;
    boardEl.classList.toggle('locked', !canPlay);
    previewDiscs.forEach((d, c) => {
      d.classList.toggle('show', canPlay && c === hoverCol && board[0][c] === EMPTY);
    });
    if (canPlay && hoverCol !== null) {
      const step = boardEl.querySelector('.cell').offsetWidth + parseFloat(getComputedStyle(boardEl).columnGap);
      const pad = parseFloat(getComputedStyle(boardEl).paddingLeft);
      colHl.style.transform = `translateX(${pad - step / 2 + step * hoverCol + boardEl.querySelector('.cell').offsetWidth / 2}px)`;
      colHl.classList.add('show');
    } else {
      colHl.classList.remove('show');
    }
  }

  async function dropDisc(col, player) {
    const r = openRow(board, col);
    board[r][col] = player;
    const disc = document.createElement('div');
    const dur = 0.16 + 0.06 * r;
    disc.className = 'disc drop ' + (player === HUMAN ? 'red' : 'yellow');
    disc.style.setProperty('--fall', r + 1);
    disc.style.setProperty('--dur', dur + 's');
    cells[r][col].appendChild(disc);
    await sleep(dur * 1000 + 220);
    disc.classList.remove('drop');
  }

  // Returns true if the game ended.
  function checkEnd(player) {
    const line = winningLine(board, player);
    if (line) {
      over = true;
      for (const [r, c] of line) cells[r][c].querySelector('.disc').classList.add('win');
      boardEl.classList.add('over');
      scores[player]++;
      setStatus(player === HUMAN ? 'You win! Nicely played.' : 'The computer wins.', player === HUMAN ? 'red' : 'yellow');
    } else if (validMoves(board).length === 0) {
      over = true;
      scores[EMPTY]++;
      setStatus("It's a draw.", null);
    }
    if (over) {
      renderScores();
      save();
    }
    return over;
  }

  async function humanMove(col) {
    if (over || busy || turn !== HUMAN || board[0][col] !== EMPTY) return;
    const id = gameId;
    busy = true;
    updateHover();
    await dropDisc(col, HUMAN);
    if (id !== gameId) return;
    busy = false;
    if (checkEnd(HUMAN)) return updateHover();
    turn = AI;
    aiMove();
  }

  async function aiMove() {
    const id = gameId;
    busy = true;
    updateHover();
    setStatus('Computer is thinking', 'yellow', true);
    await sleep(400); // let the status paint before the search blocks the thread
    if (id !== gameId) return;
    const col = chooseMove(board, settings.level);
    await dropDisc(col, AI);
    if (id !== gameId) return;
    busy = false;
    if (checkEnd(AI)) return updateHover();
    turn = HUMAN;
    setStatus('Your turn', 'red');
    updateHover();
  }

  function newGame() {
    gameId++;
    board = emptyBoard();
    over = false;
    busy = false;
    boardEl.classList.remove('over');
    for (const row of cells) for (const cell of row) cell.innerHTML = '';
    turn = settings.first === 'human' ? HUMAN : AI;
    if (turn === HUMAN) {
      setStatus('Your turn', 'red');
      updateHover();
    } else {
      aiMove();
    }
  }

  // ---------- Events ----------

  boardEl.addEventListener('click', e => {
    const cell = e.target.closest('.cell');
    if (cell) humanMove(Number(cell.dataset.col));
  });
  boardEl.addEventListener('mousemove', e => {
    const cell = e.target.closest('.cell');
    const col = cell ? Number(cell.dataset.col) : hoverCol;
    if (col !== hoverCol) {
      hoverCol = col;
      updateHover();
    }
  });
  boardEl.addEventListener('mouseleave', () => {
    hoverCol = null;
    updateHover();
  });
  document.addEventListener('keydown', e => {
    const n = Number(e.key);
    if (n >= 1 && n <= COLS) humanMove(n - 1);
    else if (e.key.toLowerCase() === 'n') newGame();
  });

  document.getElementById('difficulty').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    settings.level = b.dataset.level;
    renderSettings();
    save();
  });
  document.getElementById('first').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    settings.first = b.dataset.first;
    renderSettings();
    save();
  });
  document.getElementById('new-game').addEventListener('click', newGame);
  document.getElementById('reset-score').addEventListener('click', () => {
    scores = { [HUMAN]: 0, [AI]: 0, [EMPTY]: 0 };
    renderScores();
    save();
  });

  renderScores();
  renderSettings();
  newGame();
</script>
</body>
</html>
